name: pinned triple

# The one check that is about the COMBINATION rather than about any package.
#
# `plant/DESCRIPTION` pins its two siblings exactly --
# `LinkingTo: odelia (== 0.4.0), phylloptim (== 0.9.0)` -- so a partial landing
# fails at build rather than at run time. That is the right declaration and until
# now nothing verified it: each repository's own CI resolves `Remotes` and
# installs whatever those name, which is not necessarily what this superproject's
# submodule pointers say.
#
# This job installs the three from the submodule checkout, in dependency order,
# and then asserts three things a reader would otherwise have to take on trust:
#
#   1. every version `plant` pins is the version actually installed;
#   2. every `Remotes:` entry names a ref that resolves, which is what catches a
#      pin left on a feature branch after that branch is merged and deleted;
#   3. `plant`'s test suite passes against the combination, not against CRAN's or
#      upstream's idea of its dependencies.
#
# ⚠️ It runs on Linux only, deliberately. This is a check about which versions
# meet, not about platform behaviour: the per-repository workflows already cover
# three operating systems each, and Linux bills at a tenth of macOS.

on:
  push:
    branches: [main, master, 'ad/**', 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-triple:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install the build-time dependencies
        run: |
          install.packages(c("Rcpp", "BH", "R6", "remotes", "testthat", "pkgbuild"))
          remotes::install_github("richfitz/RcppR6")
        shell: Rscript {0}

      # In dependency order, from the checkout rather than from `Remotes`. That
      # ordering is the point: installing `phylloptim` through a
      # dependency-resolving installer is what fetches upstream `odelia` over a
      # locally built fork, which is a documented hazard in AGENTS.md.
      - name: Install odelia, phylloptim, plant from the submodules
        run: |
          R CMD INSTALL --no-multiarch --preclean odelia
          R CMD INSTALL --no-multiarch --preclean phylloptim
          R CMD INSTALL --no-multiarch --preclean plant

      - name: Every pinned version is the version installed
        run: |
          fields <- read.dcf("plant/DESCRIPTION", fields = "LinkingTo")[1, 1]
          entries <- trimws(strsplit(fields, ",")[[1]])
          pinned <- entries[grepl("==", entries, fixed = TRUE)]
          if (length(pinned) == 0L) {
            stop("plant/DESCRIPTION pins no exact version in LinkingTo. ",
                 "The pins are what make a partial landing fail at build ",
                 "rather than at run time; do not relax them to make this pass.")
          }
          bad <- character()
          for (entry in pinned) {
            name <- trimws(sub("\\(.*$", "", entry))
            want <- trimws(gsub("^.*==|\\)", "", entry))
            got <- as.character(utils::packageVersion(name))
            cat(sprintf("  %-12s pinned %-8s installed %s\n", name, want, got))
            if (!identical(want, got)) {
              bad <- c(bad, sprintf("%s: pinned %s, installed %s", name, want, got))
            }
          }
          if (length(bad) > 0L) {
            stop("A pin does not match what the submodule pointer installed:\n  ",
                 paste(bad, collapse = "\n  "))
          }
        shell: Rscript {0}

      # This is the step that catches a pin left on a feature branch. A ref that
      # has been merged and deleted still reads as a plausible `Remotes` entry
      # and fails only when somebody tries to install the package.
      - name: Every Remotes ref still resolves
        run: |
          for (pkg in c("odelia", "phylloptim", "plant")) {
            path <- file.path(pkg, "DESCRIPTION")
            field <- tryCatch(read.dcf(path, fields = "Remotes")[1, 1],
                              error = function(e) NA_character_)
            if (is.na(field)) next
            for (entry in trimws(strsplit(field, ",")[[1]])) {
              if (!nzchar(entry)) next
              parts <- strsplit(entry, "@", fixed = TRUE)[[1]]
              repo <- parts[[1]]
              ref <- if (length(parts) > 1L) parts[[2]] else "HEAD"
              url <- sprintf("https://github.com/%s.git", repo)
              out <- suppressWarnings(system2(
                "git", c("ls-remote", "--exit-code", shQuote(url), shQuote(ref)),
                stdout = TRUE, stderr = TRUE))
              status <- attr(out, "status")
              ok <- is.null(status) || identical(status, 0L)
              cat(sprintf("  %-12s %-46s %s\n", pkg, entry,
                          if (ok) "resolves" else "DOES NOT RESOLVE"))
              if (!ok) {
                stop(pkg, "/DESCRIPTION names a ref that does not resolve: ",
                     entry, ". A pin on a feature branch stops resolving the ",
                     "moment that branch is merged and deleted; point it at a ",
                     "tag or at the default branch.")
              }
            }
          }
        shell: Rscript {0}

      - name: plant's tests, against this combination
        run: |
          Sys.setenv(NOT_CRAN = "true")
          res <- testthat::test_local("plant", reporter = "summary",
                                      stop_on_failure = FALSE)
          frame <- as.data.frame(res)
          cat(sprintf("\npass=%d fail=%d error=%d skip=%d\n",
                      sum(frame$passed), sum(frame$failed),
                      sum(frame$error), sum(frame$skipped)))
          # ⚠️ Failures are reported and do not fail the job yet, because
          # test-model-version.R is expected red until a scientific_version is
          # declared for TF24 -- see AGENTS.md. Tighten this to a hard failure in
          # the same change that declares it.
          if (sum(frame$error) > 0L) {
            stop("A test file errored, which is different from a test failing: ",
                 "an error means a file stopped running.")
          }
        shell: Rscript {0}
